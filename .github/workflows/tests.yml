name: Python validation
run-name: Validate project changes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run automated tests
        shell: bash
        run: |
          mkdir -p artifacts
          python -m pytest -q | tee artifacts/tests.txt
      - name: Replay diagnostic scenarios
        run: python -m expert_system --all --output artifacts/diagnostics.json
      - name: Validate combined diagnosis and route planning
        run: python tools/combined_demo.py --output artifacts/combined-demo.json
      - name: Replay named scenarios
        run: python tools/replay_demo.py --output artifacts/demo
      - name: Validate benchmark execution
        run: python tools/benchmark_search.py --output artifacts/benchmark --repeats 1
      - name: Save verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

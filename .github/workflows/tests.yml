name: Python validation
run-name: Validate project changes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-launcher:
    name: Unix launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate shell syntax using the native Bash
        run: |
          for script in run.sh run.command install.sh; do
            /bin/bash -n "$script"
          done
      - name: Verify private Python setup, reuse, recovery and app launch
        run: python tools/check_unix_launcher.py
      - name: Check the published Terminal installer in the default Downloads folder
        if: github.ref == 'refs/heads/main'
        run: |
          (
            set -e
            installer="$(mktemp "${TMPDIR:-/tmp}/AI-TE-303-install.XXXXXX")"
            url=https://raw.githubusercontent.com/sar1p/AI-TE-303/main/install.sh
            if command -v curl >/dev/null 2>&1; then
              curl --fail --location --silent --show-error "$url" --output "$installer"
            else
              wget -q "$url" -O "$installer"
            fi
            cd /
            bash "$installer" --setup-only --managed-python
            test -f "$HOME/Downloads/AI-TE-303/.venv/.ai-te-303-ready"
            "$HOME/Downloads/AI-TE-303/.venv/bin/python" -c 'import sys,streamlit; assert sys.version_info[:2] == (3,12); assert streamlit.__version__ == "1.65.0"'
          )
      - name: Save native launcher verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unix-launcher-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/unix-launcher/
          if-no-files-found: warn
          retention-days: 30
  windows-launcher:
    name: Windows launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: wrong-python
        with:
          python-version: '3.14'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: project-python
        with:
          python-version: '3.12'
      - name: Check first setup, repeat launch, ZIP, failure recovery and port fallback
        run: python tools/check_windows_launcher.py --python "${{ steps.project-python.outputs.python-path }}" --wrong-python "${{ steps.wrong-python.outputs.python-path }}"
      - name: Save launcher verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-launcher-${{ github.sha }}
          path: artifacts/windows-launcher/**/*.log
          if-no-files-found: warn
          retention-days: 30
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run automated tests
        shell: bash
        run: |
          mkdir -p artifacts
          python -m pytest -q | tee artifacts/tests.txt
      - name: Replay diagnostic scenarios
        run: python -m expert_system --all --output artifacts/diagnostics.json
      - name: Validate combined diagnosis and route planning
        run: python tools/combined_demo.py --output artifacts/combined-demo.json
      - name: Replay named scenarios
        run: python tools/replay_demo.py --output artifacts/demo
      - name: Validate benchmark execution
        run: python tools/benchmark_search.py --output artifacts/benchmark --repeats 1
      - name: Save verification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
